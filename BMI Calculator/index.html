<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white shadow-2xl rounded-2xl max-w-5xl w-full grid md:grid-cols-2 overflow-hidden">

    <!-- LEFT SIDE -->
    <div class="p-8">

      <div class="bg-gradient-to-r from-blue-600 to-blue-500 text-white p-4 rounded-lg mb-8">
        <h1 class="text-2xl font-bold">BMI CALCULATOR</h1>
      </div>

      <!-- Height -->
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">
          Height (cm)
        </label>

        <input 
          type="number" 
          id="height"
          placeholder="Enter height"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Weight -->
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">
          Weight (kg)
        </label>

        <input 
          type="number" 
          id="weight"
          placeholder="Enter weight"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Buttons -->
      <div class="flex gap-4">
        <button 
          onclick="calculateBMI()"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-semibold transition"
        >
          Calculate Your BMI
        </button>

        <button 
          onclick="resetBMI()"
          class="border border-gray-400 hover:bg-gray-100 px-6 py-3 rounded-full font-semibold transition"
        >
          Reset
        </button>
      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="bg-gray-50 p-8 flex flex-col justify-center">

      <h2 class="text-3xl font-bold text-gray-700 mb-4">
        Your BMI is
        <span id="bmiResult" class="text-blue-600">0.0</span>
      </h2>

      <!-- Progress Bar -->
      <div class="w-full h-5 rounded-full overflow-hidden flex mb-8">

        <div class="bg-gray-300 w-1/4"></div>
        <div class="bg-green-500 w-1/4"></div>
        <div class="bg-blue-500 w-1/4"></div>
        <div class="bg-purple-600 w-1/4"></div>

      </div>

      <!-- BMI Category -->
      <div class="bg-white shadow rounded-xl p-6">

        <h3 class="text-xl font-bold mb-4 text-gray-700">
          BMI Category
        </h3>

        <div class="space-y-3">

          <div class="flex justify-between">
            <span>Underweight</span>
            <span>Below 18.5</span>
          </div>

          <div class="flex justify-between">
            <span>Healthy</span>
            <span>18.5 - 24.9</span>
          </div>

          <div class="flex justify-between">
            <span>Overweight</span>
            <span>25 - 29.9</span>
          </div>

          <div class="flex justify-between">
            <span>Obesity</span>
            <span>30+</span>
          </div>

        </div>

        <div 
          id="resultText"
          class="mt-6 text-center text-2xl font-bold text-blue-600"
        >
          Result
        </div>

      </div>

    </div>

  </div>

  <!-- External JavaScript -->
  <script src="main.js"></script>

</body>
</html>
